apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo-github
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  namespace: otel-demo-github
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
    spec:
      containers:
        - name: frontend-proxy
          image: ghcr.io/open-telemetry/demo:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
  namespace: otel-demo-github
spec:
  type: LoadBalancer
  selector:
    app: frontend-proxy
  ports:
    - port: 80
      targetPort: 8080