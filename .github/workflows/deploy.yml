name: Deploy OTel Demo to Scaleway K8s

on:
  push:
    branches:
      - main
  workflow_dispatch:  # permet un déclenchement manuel

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Scaleway CLI
        run: curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | bash

      - name: Configure Scaleway CLI
        run: |
          scw init \
            access-key=${{ secrets.SCW_ACCESS_KEY }} \
            secret-key=${{ secrets.SCW_SECRET_KEY }} \
            organization-id=${{ secrets.SCW_ORGANIZATION_ID }} \
            region=fr-par \
            zone=fr-par-2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl get nodes

      - name: Create namespace
        run: |
          kubectl create namespace otel-demo-github --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy OTel Demo
        run: |
          kubectl apply --namespace otel-demo-github -f kubernetes/opentelemetry-demo.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend-proxy \
            --namespace otel-demo-github \
            --timeout=300s

      - name: Show deployed resources
        run: |
          kubectl get pods --namespace otel-demo-github
          kubectl get services --namespace otel-demo-github